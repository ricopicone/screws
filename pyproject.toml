[project]
name = "screws"
version = "0.9.1"
description = "Robotics in Python built on screw theory: kinematics, dynamics, formulas, pictures and a CoppeliaSim bridge"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Rico Picone" }]
dependencies = ["numpy>=1.24", "sympy>=1.12"]
keywords = ["robotics", "screw theory", "product of exponentials", "kinematics", "dynamics", "Modern Robotics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/ricopicone/screws"
Documentation = "https://ricopicone.github.io/screws/"
Issues = "https://github.com/ricopicone/screws/issues"
Changelog = "https://github.com/ricopicone/screws/blob/main/CHANGELOG.md"

[project.optional-dependencies]
coppelia = ["coppeliasim-zmqremoteapi-client==2.0.4"]
plot = ["matplotlib>=3.9", "ipywidgets>=8"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "modern_robotics==1.1.1",
  "matplotlib>=3.9",
  "coppeliasim-zmqremoteapi-client==2.0.4",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4",
]
# the documentation site: `uv run --group docs mkdocs serve`
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screws"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/media/**", ".github/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["coppelia: needs a running CoppeliaSim (set SCREWS_COPPELIASIM=1)"]
# animation tests that check numbers and never render; matplotlib warns when they are collected
filterwarnings = ["ignore:Animation was deleted without rendering:UserWarning"]

[tool.ruff]
line-length = 100
