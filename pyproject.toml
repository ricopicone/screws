[project]
name = "screws"
version = "0.3.0"
description = "Screw-theory robotics: the Modern Robotics library, reorganised, with a CoppeliaSim bridge"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Rico Picone" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
coppelia = ["coppeliasim-zmqremoteapi-client==2.0.4"]
plot = ["matplotlib>=3.7"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4"]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "modern_robotics==1.1.1",
  "matplotlib>=3.7",
  "coppeliasim-zmqremoteapi-client==2.0.4",
  "imageio>=2.31",
  "imageio-ffmpeg>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screws"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/media/**", ".github/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["coppelia: needs a running CoppeliaSim (set SCREWS_COPPELIASIM=1)"]

[tool.ruff]
line-length = 100
